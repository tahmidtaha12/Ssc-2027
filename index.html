<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSC Practice Platform</title>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --border: #232f48;
      --primary: #38bdf8;
      --accent: #facc15;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      min-height: 100vh;
    }

    /* Top Navigation Header */
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      background-color: #1e293b;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background-color: #2a3a58;
      border-color: var(--primary);
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border: none;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
    }

    .btn-primary:hover {
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
      transform: translateY(-1px);
    }

    /* Dynamic User Banner */
    .user-banner {
      background: linear-gradient(135deg, #1e293b, #111827);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* Grid System for 12 Subjects */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .subject-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 18px;
      border: 1px solid var(--border);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .subject-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 4px; height: 100%;
      background: var(--primary);
      transition: width 0.2s ease;
    }

    .subject-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.15);
      border-color: #38bdf888;
    }

    .subject-tag {
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .subject-title {
      font-size: 1.2rem;
      margin: 8px 0 12px 0;
      color: #fff;
    }

    /* Interactive Quiz Container */
    .quiz-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      border: 1px solid var(--border);
      max-width: 800px;
      margin: 0 auto;
    }

    .option-btn {
      display: block;
      width: 100%;
      text-align: left;
      margin: 10px 0;
      padding: 14px;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .option-btn:hover {
      background: #1e293b;
      border-color: var(--primary);
    }

    .option-btn.selected {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.15);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
    }

    /* Leaderboard Styling */
    .leaderboard-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      border: 1px solid var(--border);
      max-width: 900px;
      margin: 0 auto;
    }

    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    .leaderboard-table th, .leaderboard-table td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }

    .leaderboard-table th {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <div class="header">
    <div class="title">🎓 Practice Platform</div>
    <div class="nav-btn-group">
      <button class="btn btn-primary" onclick="showView('home')">Home</button>
      <button class="btn" onclick="showView('leaderboard')">Leaderboard 🏆</button>
    </div>
  </div>

  <!-- Home View -->
  <div id="view-home">
    <div class="user-banner">
      <div>
        <h2 id="welcome-text" style="margin: 0 0 4px 0;">Welcome, Anonymous Candidate</h2>
        <span style="color: var(--text-muted); font-size: 0.9rem;">Select a subject below to launch your exam.</span>
      </div>
      <button class="btn" onclick="changeUsername()">Change User</button>
    </div>

    <div class="grid" id="subjects-grid"></div>
  </div>

  <!-- Quiz View -->
  <div id="view-quiz" class="hidden">
    <div class="quiz-card">
      <h2 id="quiz-title" style="margin-top: 0; color: var(--accent);">Exam</h2>
      <div id="questions-container"></div>
      <button class="btn btn-primary" style="margin-top: 20px; width: 100%; padding: 14px; font-size: 1rem;" onclick="submitExam()">Submit Exam</button>
    </div>
  </div>

  <!-- Live Supabase Leaderboard View -->
  <div id="view-leaderboard" class="hidden">
    <div class="leaderboard-card">
      <h2 style="margin-top: 0; color: var(--accent);">Global Leaderboard 🏆</h2>
      <p style="color: var(--text-muted);">Real-time candidate score tracking powered by Supabase.</p>
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th>Candidate</th>
            <th>Subject</th>
            <th>Score</th>
            <th>Accuracy</th>
          </tr>
        </thead>
        <tbody id="leaderboard-rows">
          <tr><td colspan="4" style="color: var(--text-muted);">Loading real-time scores...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Live Supabase Backend Client Credentials
    const SUPABASE_URL = "https://rmenwjldgoklzitcijix.supabase.co";
    const SUPABASE_KEY = "Sb_publishable_KFc1TG6MJe2VT--oAzSU3g_pRfBiXWJ";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUsername = "Anonymous Candidate";
    let currentSubject = "";
    let userAnswers = {};

    // Complete List of 12 SSC Subjects
    const subjects = [
      "Physics", "Chemistry", "Higher Mathematics", "Biology",
      "General Mathematics", "Bangla 1st Paper", "Bangla 2nd Paper", "English 1st Paper",
      "English 2nd Paper", "ICT", "Bangladesh & Global Studies", "Islam & Moral Education"
    ];

    // Subject Specific Questions & General Bank Fallbacks
    const questionBank = {
      "Physics": [
        { id: 1, q: "What is the SI unit of Force?", options: ["Joule", "Newton", "Pascal", "Watt"], ans: 1 },
        { id: 2, q: "Which equation represents Newton's Second Law of Motion?", options: ["F = mv", "F = ma", "E = mc²", "V = IR"], ans: 1 },
        { id: 3, q: "What is the standard value of gravitational acceleration (g)?", options: ["9.8 m/s²", "8.9 m/s²", "10 m/s²", "9.8 km/s²"], ans: 0 }
      ],
      "Chemistry": [
        { id: 1, q: "What is the atomic number of Carbon?", options: ["12", "6", "8", "14"], ans: 1 },
        { id: 2, q: "Which gas is released when metal reacts with acid?", options: ["Oxygen", "Carbon Dioxide", "Hydrogen", "Nitrogen"], ans: 2 },
        { id: 3, q: "What is the pH value of pure water?", options: ["0", "7", "14", "5"], ans: 1 }
      ]
    };

    const defaultQuestions = [
      { id: 1, q: "Concept Check 1: Select the correct core formula.", options: ["Option A", "Option B", "Option C", "Option D"], ans: 0 },
      { id: 2, q: "Concept Check 2: Identify the primary principle.", options: ["Statement 1", "Statement 2", "Statement 3", "Statement 4"], ans: 1 },
      { id: 3, q: "Concept Check 3: Which option yields true?", options: ["True", "False"], ans: 0 }
    ];

    function renderSubjects() {
      const grid = document.getElementById('subjects-grid');
      grid.innerHTML = subjects.map(sub => `
        <div class="subject-card">
          <span class="subject-tag">SSC Syllabus</span>
          <h3 class="subject-title">${sub}</h3>
          <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 16px;">Full Practice Assessment Available</p>
          <button class="btn btn-primary" style="width: 100%;" onclick="startExam('${sub}')">Start Exam</button>
        </div>
      `).join('');
    }

    function changeUsername() {
      const name = prompt("Enter candidate name:", currentUsername);
      if (name && name.trim() !== "") {
        currentUsername = name.trim();
        document.getElementById('welcome-text').innerText = `Welcome, ${currentUsername}`;
      }
    }

    function showView(view) {
      document.getElementById('view-home').classList.add('hidden');
      document.getElementById('view-quiz').classList.add('hidden');
      document.getElementById('view-leaderboard').classList.add('hidden');

      if (view === 'home') document.getElementById('view-home').classList.remove('hidden');
      if (view === 'quiz') document.getElementById('view-quiz').classList.remove('hidden');
      if (view === 'leaderboard') {
        document.getElementById('view-leaderboard').classList.remove('hidden');
        fetchLeaderboard();
      }
    }

    function getQuestionsForSubject(subject) {
      return questionBank[subject] || defaultQuestions;
    }

    function startExam(subject) {
      currentSubject = subject;
      userAnswers = {};
      document.getElementById('quiz-title').innerText = `${subject} Practice Exam`;
      
      const activeQuestions = getQuestionsForSubject(subject);
      const container = document.getElementById('questions-container');
      container.innerHTML = activeQuestions.map((q, idx) => `
        <div style="margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border);">
          <p style="font-size: 1.05rem;"><strong>Q${idx + 1}: ${q.q}</strong></p>
          ${q.options.map((opt, oIdx) => `
            <button class="option-btn" id="q${q.id}-opt${oIdx}" onclick="selectOption(${q.id}, ${oIdx})">${opt}</button>
          `).join('')}
        </div>
      `).join('');

      showView('quiz');
    }

    function selectOption(qId, optIdx) {
      userAnswers[qId] = optIdx;
      const activeQuestions = getQuestionsForSubject(currentSubject);
      const questionObj = activeQuestions.find(q => q.id === qId);
      questionObj.options.forEach((_, idx) => {
        const btn = document.getElementById(`q${qId}-opt${idx}`);
        if (idx === optIdx) btn.classList.add('selected');
        else btn.classList.remove('selected');
      });
    }

    async function submitExam() {
      const activeQuestions = getQuestionsForSubject(currentSubject);
      let correct = 0;
      activeQuestions.forEach(q => {
        if (userAnswers[q.id] === q.ans) correct++;
      });

      const total = activeQuestions.length;
      const scoreStr = `${correct} / ${total}`;
      const accuracyStr = `${Math.round((correct / total) * 100)}%`;

      const { error } = await supabaseClient.from('leaderboard').insert([
        {
          user_name: currentUsername,
          subject: currentSubject,
          score: scoreStr,
          accuracy: accuracyStr,
          time_spent: "01:30"
        }
      ]);

      if (error) {
        alert("Error syncing with Supabase leaderboard: " + error.message);
      } else {
        alert(`Exam submitted successfully for ${currentSubject}! Score: ${scoreStr} (${accuracyStr})`);
        showView('leaderboard');
      }
    }

    async function fetchLeaderboard() {
      const tbody = document.getElementById('leaderboard-rows');
      tbody.innerHTML = '<tr><td colspan="4" style="color: var(--text-muted);">Loading real-time scores...</td></tr>';

      const { data, error } = await supabaseClient
        .from('leaderboard')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        tbody.innerHTML = `<tr><td colspan="4" style="color: #f87171;">Failed to load leaderboard: ${error.message}</td></tr>`;
        return;
      }

      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="color: var(--text-muted);">No entries recorded yet. Complete an exam above!</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(row => `
        <tr>
          <td><strong>${row.user_name}</strong></td>
          <td>${row.subject}</td>
          <td>${row.score}</td>
          <td>${row.accuracy}</td>
        </tr>
      `).join('');
    }

    renderSubjects();
  </script>
</body>
</html>
